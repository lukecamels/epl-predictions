<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPL Ladder Predictions</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1b1f24; --muted: #6b7480;
    --line: #e3e6ea; --hl: #fff4c2; --gold: #d4a017; --pin: #2f6fde;
    /* Everything is sized off the row height, which is chosen so that the header,
       20 rows, totals and the status line exactly fill the screen height.
       Width is not squeezed: the predictions scroll sideways next to the pinned table. */
    --rh: clamp(19px, calc((100vh - 38px) / 22.8), 40px);
    --rh: clamp(19px, calc((100dvh - 38px) / 22.8), 40px);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161a; --panel: #1e2127; --text: #e8eaed; --muted: #9aa3ae;
            --line: #2d3138; --hl: #4a4220; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); -webkit-text-size-adjust: 100%;
         font: calc(var(--rh) * .37)/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #status { color: var(--muted); font-size: 11px; line-height: 16px; height: 22px; padding: 0 8px; text-align: center;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 1260px; margin: 0 auto; }
  #status.error { color: #c62828; }

  #board { display: flex; gap: 8px; padding: 8px 8px 6px; max-width: 1260px; margin: 0 auto; overflow-x: auto; }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .col .head { height: calc(var(--rh) * 1.5); display: flex; flex-direction: column; align-items: center; justify-content: center;
               border-bottom: 1px solid var(--line); font-weight: 700; padding: 0 4px; text-align: center; line-height: 1.05; }
  .col .head small { font-weight: 500; color: var(--muted); font-size: .8em; }
  .col .foot { height: calc(var(--rh) * 1.3 - 2px); display: flex; align-items: center; justify-content: center;
               border-top: 2px solid var(--line); font-weight: 800; font-size: 1.3em; }
  .row { height: var(--rh); display: flex; align-items: center; gap: 6px; padding: 0 8px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.hl { background: var(--hl); }
  img.logo { width: calc(var(--rh) * .7); height: calc(var(--rh) * .7); object-fit: contain; flex: 0 0 auto; }

  /* live table */
  #table { flex: 0 0 auto; position: sticky; left: 0; z-index: 2; box-shadow: 4px 0 8px -4px rgba(0,0,0,.25); }
  #table .pos { width: 1.5em; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  #table .name { width: 7em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  #table .num { width: 2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  #table .pts { color: var(--text); font-weight: 700; }
  #table .head { flex-direction: row; justify-content: flex-start; gap: 6px; padding: 0 8px; }
  #table .head .title { flex: 1; text-align: left; }
  #table .head .num { font-size: .85em; font-weight: 600; }
  #table .foot { font-size: .85em; font-weight: 600; color: var(--muted); }

  /* player columns */
  .player { flex: 1 0 80px; }
  .player .row { justify-content: center; cursor: default; }
  .player .head { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
  .player.leader { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
  .player.pinned { border-color: var(--pin); box-shadow: inset 0 0 0 1px var(--pin); }
  .player.pinned .head { background: color-mix(in srgb, var(--pin) 16%, var(--panel)); }
  .cell { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .oval { min-width: 2.6em; height: calc(var(--rh) * .58); border-radius: 99px; padding: 0 .5em; background: var(--c);
          color: #fff; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
          font-variant-numeric: tabular-nums; text-shadow: 0 1px 1px rgba(0,0,0,.35); }

  /* Phones: slim the live table down to position, crest and points (tap a team for the rest) */
  @media (max-width: 700px) {
    #board { gap: 5px; padding: 6px 6px 4px; }
    #table .title, #table .p, #table .gd, #table .name { display: none; }
    #table .head { justify-content: flex-end; }
    #table .row, #table .head { padding: 0 6px; gap: 4px; }
    #table .foot { font-size: .75em; }
    .player { flex-basis: 66px; }
    .player .cell { gap: 5px; }
  }
</style>
</head>
<body>
<main id="board"></main>
<footer id="status">Loading the current Premier League table…</footer>

<script src="predictions.js"></script>
<script>
const API = "https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings";
const CACHE_KEY = "epl-table-cache";
const PIN_KEY = "epl-pinned-player";
let lastTable = null;
let pinned = null;
try { pinned = localStorage.getItem(PIN_KEY); } catch {}

const ordinal = n => n + (n >= 11 && n <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");

// 0 → green, fading to red at 10+ places out
function scoreColour(diff) {
  const hue = 125 * (1 - Math.min(diff, 10) / 10);
  return `hsl(${hue}, 68%, 40%)`;
}

async function fetchTable() {
  const res = await fetch(API, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const entries = data.children[0].standings.entries;
  const stat = (e, name) => (e.stats.find(s => s.name === name) || {}).value ?? 0;
  const table = entries.map(e => ({
    id: Number(e.team.id),
    name: e.team.shortDisplayName,
    abbr: e.team.abbreviation,
    fullName: e.team.displayName,
    logo: e.team.logos[0].href.replace("http://", "https://"),
    rank: stat(e, "rank"),
    played: stat(e, "gamesPlayed"),
    gd: stat(e, "pointDifferential"),
    points: stat(e, "points"),
  }));
  // Before a ball is kicked ESPN reports rank 0 for everyone; fall back to list order.
  table.sort((a, b) => (a.rank || 99) - (b.rank || 99));
  table.forEach((t, i) => t.pos = i + 1);
  return table;
}

function render(table) {
  const byId = new Map(table.map(t => [t.id, t]));

  const players = Object.entries(PREDICTIONS).map(([name, picks]) => {
    const rows = picks.map((teamName, i) => {
      const team = byId.get(TEAM_IDS[teamName]);
      if (!team) throw new Error(`"${teamName}" (${name}) isn't in the live table`);
      return { team, predicted: i + 1, diff: Math.abs(i + 1 - team.pos) };
    });
    return { name, rows, total: rows.reduce((s, r) => s + r.diff, 0) };
  });
  players.sort((a, b) => a.total - b.total || a.name.localeCompare(b.name));
  players.forEach((p, i) => p.place = i && players[i - 1].total === p.total ? players[i - 1].place : i + 1);
  // A pinned player ("me") jumps to the front; everyone else stays in ranking order
  const me = players.findIndex(p => p.name === pinned);
  if (me > 0) players.unshift(players.splice(me, 1)[0]);
  lastTable = table;

  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
  const logo = t => `<img class="logo" src="${t.logo}" alt="${t.fullName}" loading="lazy">`;
  const board = document.getElementById("board");
  board.innerHTML = "";

  const tcol = el("section", "col"); tcol.id = "table";
  tcol.append(el("div", "head", `<span class="title">Current table</span><span class="num p">P</span><span class="num gd">GD</span><span class="num">Pts</span>`));
  for (const t of table) {
    const r = el("div", "row", `<span class="pos">${t.pos}</span>${logo(t)}<span class="name" title="${t.fullName}">${t.name}</span>
      <span class="num p">${t.played}</span><span class="num gd">${t.gd > 0 ? "+" : ""}${t.gd}</span><span class="num pts">${t.points}</span>`);
    r.dataset.team = t.id;
    r.dataset.info = `${ordinal(t.pos)} ${t.fullName} – played ${t.played}, GD ${t.gd > 0 ? "+" : ""}${t.gd}, ${t.points} pts`;
    tcol.append(r);
  }
  tcol.append(el("div", "foot", "Total"));
  board.append(tcol);

  for (const p of players) {
    const col = el("section", "col player" + (p.place === 1 ? " leader" : "") + (p.name === pinned ? " pinned" : ""));
    col.dataset.player = p.name;
    col.append(el("div", "head", `<span>${p.name === pinned ? "📌 " : p.place === 1 ? "🏆 " : ""}${p.name}</span><small>${ordinal(p.place)}</small>`));
    for (const r of p.rows) {
      const row = el("div", "row", `<span class="cell" style="--c:${scoreColour(r.diff)}">${logo(r.team)}<span class="oval">${r.diff}</span></span>`);
      row.dataset.team = r.team.id;
      row.dataset.info = row.title = `${p.name} – ${r.team.fullName}: predicted ${ordinal(r.predicted)}, currently ${ordinal(r.team.pos)}`;
      col.append(row);
    }
    col.append(el("div", "foot", p.total));
    board.append(col);
  }
}

// Tap a player's name to pin them next to the table (tap again to unpin); remembered on this device
document.getElementById("board").addEventListener("click", e => {
  const head = e.target.closest(".player .head");
  if (!head || !lastTable) return;
  const name = head.parentElement.dataset.player;
  pinned = pinned === name ? null : name;
  try { pinned ? localStorage.setItem(PIN_KEY, pinned) : localStorage.removeItem(PIN_KEY); } catch {}
  render(lastTable);
  document.getElementById("board").scrollLeft = 0;
});

// Tap a prediction to see its details in the status line (phones have no tooltips)
let baseStatus = "";
document.addEventListener("click", e => {
  const row = e.target.closest(".row[data-info]");
  document.getElementById("status").textContent = row ? row.dataset.info : baseStatus;
});

// Hover (or tap) a team to highlight it everywhere
document.getElementById("board").addEventListener("pointerover", e => {
  const row = e.target.closest(".row");
  document.querySelectorAll(".row.hl").forEach(r => r.classList.remove("hl"));
  if (row) document.querySelectorAll(`.row[data-team="${row.dataset.team}"]`).forEach(r => r.classList.add("hl"));
});

async function load() {
  const status = document.getElementById("status");
  try {
    const table = await fetchTable();
    render(table);
    const now = new Date();
    status.className = "";
    status.textContent = baseStatus = `Live table fetched ${now.toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}.`;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: now.toISOString(), table })); } catch {}
  } catch (err) {
    console.error(err);
    status.className = "error";
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CACHE_KEY)); } catch {}
    if (cached) {
      render(cached.table);
      status.textContent = `Couldn't fetch the live table (${err.message}). Showing the table as of ${new Date(cached.at).toLocaleString()}.`;
    } else {
      status.textContent = `Couldn't fetch the live table (${err.message}). Try refreshing.`;
    }
  }
}

load();
// Refresh when someone comes back to a tab that's been left open
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
